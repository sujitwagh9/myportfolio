# Alternative to Caddy. Get certificates first with:
#   certbot certonly --webroot -w /var/www/certbot -d example.com -d www.example.com
# Replace example.com everywhere below.

limit_req_zone $binary_remote_addr zone=ai:10m rate=30r/m;

upstream portfolio {
    server 127.0.0.1:3000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name example.com www.example.com;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://example.com$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name example.com;

    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    server_tokens off;
    client_max_body_size 64k;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection        "";

    # Streaming AI chat: disable buffering so tokens arrive as they are generated.
    location = /api/chat {
        limit_req zone=ai burst=10 nodelay;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 120s;
        proxy_pass http://portfolio;
    }

    location ~ ^/api/(job-fit|greeting) {
        limit_req zone=ai burst=5 nodelay;
        proxy_read_timeout 90s;
        proxy_pass http://portfolio;
    }

    location /_next/static/ {
        proxy_pass http://portfolio;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://portfolio;
    }
}
